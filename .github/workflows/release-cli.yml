name: Release Glow CLI

on:
  push:
    tags: ['cli-v*']

permissions:
  contents: read

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
          include-prerelease: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify tag matches package version
        run: |
          [xml]$project = Get-Content tools/Glow.Cli/Glow.Cli.csproj -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          if ($env:RELEASE_TAG -cne "cli-v$version") {
            throw "Tag $env:RELEASE_TAG must match package version cli-v$version."
          }
          "CLI_VERSION=$version" >> $env:GITHUB_ENV
      - name: Test both target frameworks
        run: |
          dotnet test tools/Glow.slnx -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test browser interoperability
        run: |
          npm ci --registry=https://packagefeedproxy.microsoft.io/npm/
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:GLOW_CLI_DLL = (Resolve-Path 'tools/Glow.Cli/bin/Release/net10.0/Glow.Cli.dll').Path
          node --test tests/dotnet-cli.test.js tests/manual.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Pack release tool
        run: |
          dotnet pack tools/Glow.Cli/Glow.Cli.csproj -c Release --no-build --no-restore -o artifacts/release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install and smoke-test release package
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'glow-release-tools'
          dotnet tool install Glow.Cli --tool-path $tools --source artifacts/release --version $env:CLI_VERSION --framework net10.0 --configfile tools/NuGet.Config --no-cache
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $tools 'glow') --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $tools 'glow') convert tools/Glow.slnx --target net10.0 --output artifacts/release-smoke.config.yaml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create checksum and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $package = "artifacts/release/Glow.Cli.$env:CLI_VERSION.nupkg"
          $hash = (Get-FileHash $package -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $package -Leaf)" | Set-Content artifacts/release/SHA256SUMS -Encoding utf8NoBOM
          $options = @()
          if ($env:CLI_VERSION.Contains('-')) { $options += '--prerelease' }
          gh release create $env:RELEASE_TAG $package artifacts/release/SHA256SUMS --verify-tag --title "Glow CLI $env:CLI_VERSION" --notes-file tools/Glow.Cli/README.md @options
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
